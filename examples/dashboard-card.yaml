# Flighttracker dashboard card, modelled on the original e-paper layout.
#
# Entity IDs depend on the language HA used when the integration was set up.
# English: sensor.flighttracker_flight / sensor.flighttracker_status
# German:  sensor.flighttracker_flug   / sensor.flighttracker_status
# Adjust the two `set` lines below if yours differ.

type: markdown
content: >-
  {% set f = 'sensor.flighttracker_flight' %}
  {% set status = states('sensor.flighttracker_status') %}
  {% if status == 'flight' %}
  {% if state_attr(f, 'logo') %}<img src="{{ state_attr(f, 'logo') }}" width="110" align="right">{% endif %}

  # {{ state_attr(f, 'airline') or states(f) }}
  **{{ states(f) }}**

  ## {{ state_attr(f, 'origin_iata') or '???' }} ✈ {{ state_attr(f, 'destination_iata') or '???' }}
  {{ state_attr(f, 'aircraft_type') or 'Unknown type' }}

  ---
  ### {{ state_attr(f, 'speed_kmh') }} km/h · {{ state_attr(f, 'altitude_m') }} m

  From: {{ state_attr(f, 'origin_name') or 'unknown' }}<br>
  To: {{ state_attr(f, 'destination_name') or 'unknown' }}<br>
  <small>{{ state_attr(f, 'distance_km') }} km away</small>
  {% elif status == 'quiet' %}
  # 🌙 Quiet hours
  {% else %}
  # ☁️ No aircraft in sight
  {% endif %}

---
# Map with the current plane and your home (put it below the card above)
type: map
entities:
  - entity: sensor.flighttracker_flight
  - zone.home
hours_to_show: 0
